name: frontend
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # development-only, and `enabled: !kReleaseMode` compiles it out of any release build. it draws
  # the app inside a phone frame so `make desktop` shows real phone proportions instead of filling
  # the window. the android emulator does NOT replace this: the emulator is a real device running a
  # debug build, which is slow enough that scrolling stutters, while the desktop build is native and
  # smooth. two tools, two jobs - the emulator is where the map exists, this is where layout work is
  # comfortable. **remove before shipping** - see the release checklist in CLAUDE.md.
  flutter_lucide: ^1.33.0
  http: ^1.6.0
  # the owner's camera roll, for product photos. always called with maxWidth/imageQuality set (see
  # ProductPhotoField): those parameters are what make the plugin re-encode to jpeg on the device,
  # which both bakes the EXIF rotation into the pixels and converts an iPhone HEIC into something
  # the backend can decode.
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  # the phone's own gps, behind «Рядом со мной» on the map. the permission dialog is as much of the
  # reason as the fix is: android hands out no coordinate until the user has said yes, and there is
  # no way to ask from dart without a plugin. **the coordinate never leaves the device** - it moves
  # our camera and nothing else, which is what keeps the Play data-safety answer "not collected".
  geolocator: ^14.1.1
  flutter_secure_storage: ^10.3.1
  provider: ^6.0.8
  yandex_maps_mapkit_lite: ^4.42.0
  # the android share sheet, behind the disc on a shop card's cover. ACTION_SEND needs an Intent,
  # which there is no way to raise from dart. **text only** - there is no page per shop and no deep
  # link into the app, so what it hands over is the name, the address, the number and a maps url.
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # lets a test stand in for the phone's url handler, which is the only way to see which link
  # «Маршрут» actually hands over - launchUrl answers true or false and nothing else
  url_launcher_platform_interface: ^2.3.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # the product shots behind the home screen's category tiles. one file per category that has one -
  # see ProductCategory.photo - cut to 384x296 webp, which is the tile's slot on a 3x screen and the
  # reason the whole set is under 80KB.
  # bundled, not served: these are the first thing on the home screen, so they have to be there
  # before the network is. product photos are the opposite and come from the api - see images/shops.
  assets:
    - assets/decorations/categories/
    # the white DOMIX wordmark, a drawn letterform rather than a typeface anything could set in a Text.
    - assets/brand/
    # one drawing per ShopCategory, each carrying its own drop shadow and ground mark and its point
    # on the bottom row dead centre, so every map pin anchors at (0.5, 1.0) - see ShopPinIcon.
    - assets/map/pins/

  # the rim of the glass the nav bar is cut from - see GlassSurface. compiled to the device's own
  # shader format at build time, which is why it is declared here and not loaded as an asset.
  shaders:
    - shaders/liquid_glass.frag

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
