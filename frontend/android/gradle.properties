# Gradle JVM sizing, tuned for this laptop rather than left on the Flutter template's default.
#
# The template ships `-Xmx8G -XX:MaxMetaspaceSize=4G`. This machine has 7.4 GB of RAM in total, so
# that permits one build process to ask for more memory than the computer has - and it does ask,
# because the JVM grows its heap until it hits the ceiling rather than until it is done. The result
# was the whole desktop freezing mid-build and the OOM killer taking whatever it reached first.
#
# The laptop now has 16 GB, so these are sized for that rather than for the 7.4 GB machine the
# comment above describes. 4 GB for Gradle plus 2 GB for the Kotlin daemon plus a 4 GB emulator
# still leaves the desktop about 6 GB, which is the margin that was missing before.
#
# **R8 is the reason this is 4 GB and not 2.** The code shrinker only runs for `--release`, it is
# the hungriest step in the build, and it had never been run on this project at 2 GB. If a release
# build ever still dies with OutOfMemoryError, close the emulator before raising this further -
# an emulator holding 4 GB is the bigger of the two.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compiler runs in its *own* daemon, a second JVM that the line above does not govern.
# Left unset it picks its own default and quietly doubles the build's footprint.
kotlin.daemon.jvmargs=-Xmx2G

# Gradle otherwise sizes its worker pool off the CPU count and runs that many compilations at once,
# each in its own process. On a memory-constrained machine that is the difference between a slow
# build and an unusable desktop.
org.gradle.workers.max=4

# Reuses task outputs across builds, so a rebuild that changes only Dart code skips the Android
# compilation entirely. Costs disk in build/, saves minutes.
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
