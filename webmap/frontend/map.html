<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Добавить магазин</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --sheet-height: 100px;
            --sheet-radius: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --surface: rgba(255, 255, 255, 0.97);
            --surface-strong: rgba(255, 255, 255, 1);
            --border: rgba(15, 23, 42, 0.07);
            --border-focus: rgba(15, 23, 42, 0.14);
            --text-main: #0f172a;
            --text-soft: #475569;
            --text-muted: #94a3b8;
            --accent: #111827;
            --result-hover: rgba(15, 23, 42, 0.04);
            --result-hover-strong: rgba(15, 23, 42, 0.07);
            --shadow-sheet: 0 -2px 20px rgba(15, 23, 42, 0.08), 0 -1px 0 rgba(15,23,42,0.04);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            margin: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background: #e8f0e8;
            touch-action: none;
        }

        #map {
            position: fixed;
            inset: 0;
            z-index: 1;
            touch-action: pan-x pan-y;
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        .map-credits {
            position: fixed;
            right: 8px;
            bottom: calc(var(--sheet-height) + 8px);
            z-index: 450;
            font-size: 9px;
            color: rgba(15, 23, 42, 0.25);
            pointer-events: none;
            transition: bottom 200ms ease;
            letter-spacing: 0.01em;
        }


        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1200;
            pointer-events: none;
        }

        .sheet-card {
            height: var(--sheet-height);
            display: flex;
            flex-direction: column;
            gap: 0;
            background: var(--surface);
            border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
            box-shadow: var(--shadow-sheet);
            pointer-events: auto;
            overflow: hidden;
            transition: height 240ms cubic-bezier(0.32, 0.72, 0, 1);
            touch-action: none;
        }

        .sheet-card.is-dragging {
            transition: none;
        }

        .sheet-header {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 24px;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }

        .sheet-header:active {
            cursor: grabbing;
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.6);
        }


        .search-wrap {
            flex: 0 0 auto;
            padding: 0 14px 10px;
        }

        .search-field {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 48px;
            padding: 0 14px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border);
            background: var(--surface-strong);
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        .search-field:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05);
        }

        .search-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--text-muted);
        }

        #search-input {
            flex: 1;
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--text-main);
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        #search-input::placeholder {
            color: var(--text-muted);
        }

        #search-input::-webkit-search-cancel-button,
        #search-input::-webkit-search-decoration {
            display: none;
        }

        .sheet-content {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .results-shell {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            pointer-events: none;
            transform: translateY(-4px);
            transition:
                opacity 160ms ease,
                max-height 200ms ease,
                transform 160ms ease;
        }

        .results-shell.is-visible {
            opacity: 1;
            max-height: 400px;
            pointer-events: auto;
            transform: translateY(0);
        }

        .results-list {
            padding: 0 14px 6px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 380px;
        }

        .result-item {
            display: block;
            width: 100%;
            padding: 11px 10px;
            border: 0;
            border-radius: var(--radius-sm);
            background: rgba(148, 163, 184, 0.07);
            color: inherit;
            text-align: left;
            cursor: pointer;
            margin-bottom: 4px;
            opacity: 0;
            transform: translateY(4px);
            animation: suggestion-in 160ms ease forwards;
            transition: background 140ms ease;
            font-family: inherit;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-item:hover,
        .result-item:focus-visible {
            background: rgba(148, 163, 184, 0.16);
            outline: none;
        }

        .result-item:active {
            background: rgba(15, 23, 42, 0.08);
        }

        .result-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.35;
        }

        .result-subtitle {
            margin-top: 3px;
            font-size: 12px;
            color: var(--text-soft);
            line-height: 1.4;
        }

        .result-skeleton {
            height: 54px;
            border-radius: var(--radius-sm);
            margin-bottom: 4px;
            background:
                linear-gradient(
                    90deg,
                    rgba(148, 163, 184, 0.08) 0%,
                    rgba(148, 163, 184, 0.16) 50%,
                    rgba(148, 163, 184, 0.08) 100%
                );
            background-size: 200% 100%;
            animation: shimmer 1.2s linear infinite;
        }

        .selection-panel {
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            pointer-events: none;
            transform: translateY(6px);
            transition:
                opacity 180ms ease,
                max-height 220ms ease,
                transform 180ms ease;
        }

        .selection-panel.is-visible {
            opacity: 1;
            max-height: 200px;
            pointer-events: auto;
            transform: translateY(0);
        }

        .selection-card {
            padding: 4px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .selection-divider {
            height: 1px;
            background: rgba(15, 23, 42, 0.07);
            margin-bottom: 4px;
        }

        .selection-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
        }

        .selection-address {
            margin-top: 3px;
            font-size: 13px;
            color: var(--text-soft);
            line-height: 1.5;
        }

        .confirm-btn {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: -0.01em;
            transition: opacity 140ms ease, transform 140ms ease;
        }

        .confirm-btn:active {
            transform: scale(0.98);
            opacity: 0.88;
        }


        .selected-marker {
            background: transparent;
            border: 0;
        }

        .selected-marker__pin {
            position: relative;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3.5px solid #ffffff;
            background: #111827;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.3);
        }

        .selected-marker__pin::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 2px;
            height: 12px;
            background: #111827;
            border-radius: 999px;
            transform: translateX(-50%);
            margin-top: 1px;
        }

        @keyframes suggestion-in {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Subtle attribution — legally required, visually minimal -->
    <div class="map-credits">© OpenStreetMap · CARTO</div>

    <div class="bottom-sheet">
        <div class="sheet-card" id="sheet-card">

            <div class="sheet-header" id="sheet-header">
                <div class="sheet-handle"></div>
            </div>

            <div class="search-wrap">
                <label class="search-field" for="search-input">
                    <svg class="search-icon" viewBox="0 0 20 20" fill="none"
                         stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <circle cx="8.5" cy="8.5" r="5.5"/>
                        <path d="M13 13l4 4"/>
                    </svg>
                    <input
                        id="search-input"
                        type="search"
                        autocomplete="street-address"
                        autocapitalize="none"
                        autocorrect="off"
                        enterkeyhint="search"
                        spellcheck="false"
                    />
                </label>
            </div>

            <div class="sheet-content" id="sheet-content">

                <div class="results-shell" id="results-shell">
                    <div class="results-list" id="search-results"></div>
                </div>

                <div class="selection-panel" id="selection-panel">
                    <div class="selection-card">
                        <div class="selection-divider"></div>
                        <div>
                            <div class="selection-title" id="selection-title"></div>
                            <div class="selection-address" id="selection-address"></div>
                        </div>
                        <button id="confirm-btn" class="confirm-btn" type="button"></button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>

    const tg = window.Telegram?.WebApp;
    tg?.disableVerticalSwipes?.();
    tg?.expand?.();
    tg?.ready?.();
    tg?.setBackgroundColor?.("#e8f0e8");
    tg?.setHeaderColor?.("#ffffff");

    const langCode = (tg?.initDataUnsafe?.user?.language_code || "ru").toLowerCase();
    const isUz = langCode.startsWith("uz");

    const i18n = {
        placeholder:   isUz ? "Manzilni qidiring..."  : "Найти адрес...",
        confirmButton: isUz ? "Manzilni tasdiqlash"   : "Подтвердить адрес",
    };

    const TASHKENT = [41.3111, 69.2797];
    const UZ_BOUNDS = L.latLngBounds([37.1722, 55.9966], [45.5901, 73.2317]);
    const searchInput    = document.getElementById("search-input");
    const resultsShell   = document.getElementById("results-shell");
    const searchResults  = document.getElementById("search-results");
    const selectionPanel = document.getElementById("selection-panel");
    const selectionTitle = document.getElementById("selection-title");
    const selectionAddr  = document.getElementById("selection-address");
    const confirmBtn     = document.getElementById("confirm-btn");
    const sheetCard      = document.getElementById("sheet-card");
    const sheetHeader    = document.getElementById("sheet-header");
    const mapCredits     = document.querySelector(".map-credits");

    searchInput.placeholder = i18n.placeholder;
    confirmBtn.textContent  = i18n.confirmButton;

    const map = L.map("map", {
        attributionControl: false,
        zoomControl: false,
        minZoom: 6,
        maxZoom: 19,
        maxBounds: UZ_BOUNDS.pad(0.08),
        maxBoundsViscosity: 1.0,
        preferCanvas: true,
        tap: true,
        dragging: true,
    }).setView(TASHKENT, 13);

    // CartoDB Voyager — colorful, modern, free (with attribution)
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        subdomains: "abcd",
        maxZoom: 19,
    }).addTo(map);

    const mapContainer = map.getContainer();

    mapContainer.addEventListener("touchstart", e => {
        e.stopPropagation();
    }, { passive: true });

    mapContainer.addEventListener("pointerdown", e => {
        if (e.target === mapContainer || mapContainer.contains(e.target)) {
            e.stopPropagation();
        }
    }, { capture: false });

    const markerIcon = L.divIcon({
        className: "selected-marker",
        html: '<div class="selected-marker__pin"></div>',
        iconSize: [22, 36],
        iconAnchor: [11, 34],
    });

    let userMarker      = null;
    let lastMarkerLatLng = null;
    let activeSelection  = null;

    function placeMarker(latlng) {
        const ll = L.latLng(latlng);
        if (!UZ_BOUNDS.contains(ll)) return;
        lastMarkerLatLng = ll;
        if (userMarker) {
            userMarker.setLatLng(ll);
        } else {
            userMarker = L.marker(ll, { icon: markerIcon, draggable: true }).addTo(map);
            userMarker.on("dragend", () => {
                const pos = userMarker.getLatLng();
                if (!UZ_BOUNDS.contains(pos)) {
                    userMarker.setLatLng(lastMarkerLatLng || TASHKENT);
                    return;
                }
                lastMarkerLatLng = pos;
                hideSelectionPanel();
                hideResults();
            });
        }
    }

    let sheetHeight    = 100;
    let snapPoints     = [];
    let dragState      = null;
    let rafResize      = null;

    function buildSnaps() {
        const vh = window.innerHeight;
        const peek   = Math.round(Math.max(90, vh * 0.14));   // collapsed: just search bar
        const medium = Math.round(Math.min(Math.max(300, vh * 0.44), vh - 160));  // results
        const full   = Math.round(Math.min(vh - 16, Math.max(medium + 100, vh * 0.82)));
        snapPoints = [peek, medium, full];
    }

    function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

    function setSheetHeight(h, animate = true) {
        const min = snapPoints[0];
        const max = snapPoints[snapPoints.length - 1];
        sheetHeight = clamp(Math.round(h), min, max);
        sheetCard.classList.toggle("is-dragging", !animate);
        document.documentElement.style.setProperty("--sheet-height", `${sheetHeight}px`);
        if (mapCredits) {
            mapCredits.style.bottom = `${sheetHeight + 8}px`;
        }
        if (rafResize) cancelAnimationFrame(rafResize);
        rafResize = requestAnimationFrame(() => {
            map.invalidateSize({ pan: false });
            rafResize = null;
        });
    }

    function snapTo(target) {
        const snapped = snapPoints.reduce((best, pt) =>
            Math.abs(pt - target) < Math.abs(best - target) ? pt : best,
            snapPoints[0]
        );
        setSheetHeight(snapped, true);
        if (snapped === snapPoints[0]) {
            hideResults();
        }
    }

    function onHeaderPointerDown(e) {
        if (e.target.closest("input, button")) return;
        dragState = { startY: e.clientY, startH: sheetHeight };
        sheetHeader.setPointerCapture?.(e.pointerId);
        sheetCard.classList.add("is-dragging");
        e.preventDefault();
    }

    function onPointerMove(e) {
        if (!dragState) return;
        const delta = dragState.startY - e.clientY;
        setSheetHeight(dragState.startH + delta, false);
    }

    function onPointerUp(e) {
        if (!dragState) return;
        sheetHeader.releasePointerCapture?.(e.pointerId);
        dragState = null;
        sheetCard.classList.remove("is-dragging");
        snapTo(sheetHeight);
    }

    sheetHeader.addEventListener("pointerdown", onHeaderPointerDown);
    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);

    let searchController = null;
    let searchToken      = 0;
    let debounceTimer    = null;

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;",
            '"': "&quot;", "'": "&#39;"
        }[c]));
    }

    function hideResults() {
        resultsShell.classList.remove("is-visible");
        searchResults.innerHTML = "";
    }

    function showSkeletons() {
        searchResults.innerHTML = `
            <div class="result-skeleton"></div>
            <div class="result-skeleton"></div>
            <div class="result-skeleton"></div>
        `;
        resultsShell.classList.add("is-visible");
    }

    function renderResults(items) {
        searchResults.innerHTML = "";

        if (!items.length) {
            hideResults();
            return;
        }

        items.forEach((item, i) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "result-item";
            btn.style.animationDelay = `${i * 20}ms`;
            btn.innerHTML = `
                <div class="result-title">${escapeHtml(item.title || item.display_name)}</div>
                <div class="result-subtitle">${escapeHtml(item.subtitle || item.display_name)}</div>
            `;
            btn.addEventListener("click", () => selectResult(item));
            searchResults.appendChild(btn);
        });

        resultsShell.classList.add("is-visible");
    }

    function showSelectionPanel(item) {
        selectionTitle.textContent = item.title || item.display_name;
        selectionAddr.textContent  = item.display_name;
        selectionPanel.classList.add("is-visible");
    }

    function hideSelectionPanel() {
        activeSelection = null;
        selectionPanel.classList.remove("is-visible");
    }

    function selectResult(item) {
        const coords = L.latLng(Number(item.lat), Number(item.lon));

        placeMarker(coords);
        map.setView(coords, Math.max(map.getZoom(), 16), { animate: true, duration: 0.4 });

        searchInput.value = item.title || item.display_name;
        searchInput.blur();

        activeSelection = item;
        hideResults();
        showSelectionPanel(item);

        snapTo(snapPoints[1]);
    }

    async function doSearch(query) {
        const q = query.trim();
        if (q.length < 2) {
            hideResults();
            return;
        }

        searchController?.abort();
        const token = ++searchToken;
        searchController = new AbortController();

        showSkeletons();
        if (sheetHeight < snapPoints[1]) snapTo(snapPoints[1]);

        try {
            const lang = isUz ? "uz,ru" : "ru,uz";
            const res  = await fetch(
                `/api/geocode/search?q=${encodeURIComponent(q)}&lang=${lang}`,
                { signal: searchController.signal, credentials: "same-origin" }
            );

            if (token !== searchToken) return;
            if (!res.ok) { hideResults(); return; }

            const data = await res.json();
            if (token !== searchToken) return;

            renderResults(Array.isArray(data.items) ? data.items : []);
        } catch (err) {
            if (err.name === "AbortError") return;
            hideResults();
        }
    }

    function debounceSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => doSearch(searchInput.value), 200);
    }

    searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim();

        if (!q) {
            clearTimeout(debounceTimer);
            searchController?.abort();
            hideResults();
            hideSelectionPanel();
            snapTo(snapPoints[0]);
            return;
        }

        hideSelectionPanel();
        debounceSearch();
    });

    searchInput.addEventListener("focus", () => {
        const q = searchInput.value.trim();
        if (q.length >= 2) {
            doSearch(q);
        } else {
            snapTo(snapPoints[1]);
        }
    });

    document.querySelector(".search-wrap").addEventListener("submit", e => {
        e.preventDefault();
        clearTimeout(debounceTimer);
        doSearch(searchInput.value);
    });

    map.on("click", e => {
        if (!UZ_BOUNDS.contains(e.latlng)) return;
        placeMarker(e.latlng);
        hideResults();
        hideSelectionPanel();
        searchInput.blur();
        snapTo(snapPoints[0]);
    });

    confirmBtn.addEventListener("click", () => {
        if (!activeSelection || !lastMarkerLatLng) return;
        tg?.sendData?.(JSON.stringify({
            lat: lastMarkerLatLng.lat,
            lng: lastMarkerLatLng.lng,
            address: activeSelection.display_name,
        }));
        tg?.close?.();
    });

    buildSnaps();
    setSheetHeight(snapPoints[0], false);
    window.addEventListener("resize", () => {
        buildSnaps();
        snapTo(sheetHeight);
    });
    </script>
</body>
</html>
