# The photo host. `img.domix-app.uz` points at this same server and serves `/srv/domix/images`
# alone - no api, no admin, no telegram webhook - so that the record in front of it can be
# orange-clouded at Cloudflare without putting a cache or a bot challenge in front of a sign-in.
# The apex stays grey-clouded; that is what keeps certbot's HTTP-01 renewal reaching this box
# (deployment skill).
#
# **Nothing is served from here until IMAGE_BASE_URL names it.** The api keeps answering `/images/…`
# relative until that line is in `.env`, and removing it again is the whole rollback.
#
# Install as /etc/nginx/sites-available/img.domix-app.uz, link into sites-enabled, then
# `certbot --nginx -d img.domix-app.uz --redirect`.

server {
    listen 80;
    listen [::]:80;
    server_name img.domix-app.uz;

    location /images/ {
        alias /srv/domix/images/;

        # a stored photo's name is random and an upload writes a new path rather than overwriting,
        # so a year is safe here and is also what Cloudflare caches on
        add_header Cache-Control "public, max-age=31536000, immutable";

        # a directory index would hand anyone who guessed the path every photo in the market
        autoindex off;

        # jpegs are compressed already
        gzip off;

        access_log off;
    }

    # this host exists for one directory; everything else here is a mistake, not a route
    location / {
        return 404;
    }
}
