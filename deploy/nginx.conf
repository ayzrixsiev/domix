# The public front of the Domix api: nginx takes 80/443 and hands every request to Go on
# 127.0.0.1:8080. Install as /etc/nginx/sites-available/domix-api.uz, link into sites-enabled, then
# `certbot --nginx -d domix-api.uz` adds the HTTPS half to this block itself.
#
# Set TRUST_PROXY=true in the api's .env alongside this.

server {
    listen 80;
    listen [::]:80;
    server_name domix-api.uz;

    # photo uploads are up to 6 MiB; nginx's own default of 1 MiB would refuse most phone photos
    client_max_body_size 7m;

    # nginx buffers the whole body before passing it on, so Go never sees one arriving byte by byte.
    # this bounds the silence between two reads of it.
    client_body_timeout 30s;

    # json shrinks six- to tenfold, and the app already asks for gzip. Go compresses nothing itself.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **the rate limiter's only source of truth about who is calling**: this appends the address
        # nginx saw, and the api reads the last entry (ratelimit.clientIP). without this line nginx
        # passes the caller's own header through and the limiter reads an address they chose.
        #
        # behind Cloudflare's proxy this address becomes Cloudflare's - restore the real one first with
        # `real_ip_header CF-Connecting-IP;` and `set_real_ip_from` per Cloudflare range.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
