# The public front of the Domix api: nginx takes 80/443, serves the product photos off this
# server's own disk, and hands everything else to Go on 127.0.0.1:8080. Install as
# /etc/nginx/sites-available/domix-app.uz, link into sites-enabled, then
# `certbot --nginx -d domix-app.uz --redirect` moves this block to 443 and leaves port 80 answering
# only with a redirect - so every location below, the two refusals included, exists on HTTPS alone.
#
# Set TRUST_PROXY=true in the api's .env alongside this; the api refuses to boot without the line.
#
# **The photo directory below and the api's IMAGES_DIR have to be the same path.** They are two
# halves of one setting, and when they disagree nothing says so: uploads answer 200, /health is
# green, and every product tile in the market is blank. Cloudflare R2 holds the nightly backup of
# that directory and nothing else - photos are served from inside Uzbekistan, where the people
# looking at them are (deploy/backup.sh).

server {
    listen 80;
    listen [::]:80;
    server_name domix-app.uz;

    # photo uploads are up to 6 MiB; nginx's own default of 1 MiB would refuse most phone photos
    client_max_body_size 7m;

    # nginx buffers the whole body before passing it on, so Go never sees one arriving byte by byte.
    # this bounds the silence between two reads of it.
    client_body_timeout 30s;

    # json shrinks six- to tenfold, and the app already asks for gzip. Go compresses nothing itself.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;

    # **~99% of all traffic in this app is these files**, and nginx serving them off the disk costs
    # no Go handler, no proxy hop and no connection held open behind one.
    location /images/ {
        alias /srv/domix/images/;

        # the same immutable year the api sets on this path (staticFiles in cmd/api/main.go), safe
        # for the same reason: a stored photo's name is random, so a replaced photo is a new url and
        # no device is left showing the old one
        add_header Cache-Control "public, max-age=31536000, immutable";

        # a directory index would hand anyone who guessed the path a list of every photo in the
        # market, owners' uploads included. off is nginx's default; this is the line that keeps it
        # off when somebody turns it on globally.
        autoindex off;

        # jpegs are compressed already - gzip here spends cpu on both ends for nothing
        gzip off;

        # photo requests outnumber api requests by two orders of magnitude and would bury every
        # useful line in the access log; failures still land in the error log
        access_log off;
    }

    # **the admin panel is not on the internet.** it is opened through `ssh -L 8081:127.0.0.1:8080`
    # (admin-panel skill), which reaches the api on loopback without passing through here. RequireAdmin
    # is still the lock; this is why a stolen admin token has no door to try it on. `^~` so that a regex
    # location added later cannot outrank either refusal.
    location ^~ /admin {
        deny all;
    }
    location ^~ /api/admin/ {
        deny all;
    }

    # **this block also carries telegram's POST /api/telegram/webhook**, the only way any sign-in
    # completes: narrowing it or adding a refusal in front of that path breaks every login silently.
    # the X-Telegram-Bot-Api-Secret-Token header has to reach Go untouched - it is the webhook's lock.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **the rate limiter's only source of truth about who is calling**: this appends the address
        # nginx saw, and the api reads the last entry (ratelimit.ClientIP). without this line nginx
        # passes the caller's own header through and the limiter reads an address they chose.
        #
        # behind Cloudflare's proxy this address becomes Cloudflare's - restore the real one first with
        # `real_ip_header CF-Connecting-IP;` and `set_real_ip_from` per Cloudflare range.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
