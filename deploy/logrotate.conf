# Log retention, and it is the privacy policy that sets the number.
#
# **§6 of the published policy says "журналы сервера — до 90 дней".** A promise in a policy document
# that nothing enforces is the exact mismatch Google looks for, so this file is what makes the
# sentence true rather than aspirational. Change one and change the other -
# backend/internal/webui/pages/privacy.html and privacy_policy.dart.
#
# Install as /etc/logrotate.d/domix. nginx ships its own rule for these files, and two rules over one
# path fight: **delete /etc/logrotate.d/nginx or drop its access.log/error.log lines** before
# installing this, or rotation happens twice and the retention is not what either file says.
#
# The api itself logs to stdout and is collected by journald, which this file does not touch. Cap it
# there instead, in /etc/systemd/journald.conf:
#
#   MaxRetentionSec=90day
#
# then `systemctl restart systemd-journald`. Without that line journald keeps logs until the disk
# budget runs out, which on a quiet server is far longer than ninety days.

/var/log/nginx/*.log {
    daily
    rotate 90
    missingok
    notifempty
    compress
    delaycompress
    # the dates are the point: a rotation that overwrites by number makes "90 days" unverifiable
    dateext
    dateformat -%Y-%m-%d
    create 0640 www-data adm
    sharedscripts
    postrotate
        # nginx holds the file open, so it has to be told to reopen - without this it keeps writing
        # into the rotated inode and the live log stays empty
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}
